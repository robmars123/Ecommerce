server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Long cache for fingerprinted Expo bundles.
  location /_expo/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback (web.output: single): every expo-router route serves index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
