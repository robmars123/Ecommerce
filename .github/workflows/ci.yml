name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan tracked files for secrets
        run: |
          pattern='sk_(live|test)_[A-Za-z0-9]{10,}|rk_(live|test)_[A-Za-z0-9]{10,}|whsec_[A-Za-z0-9]{10,}|-----BEGIN ([A-Z]+ )?PRIVATE KEY-----|[Pp]assword=[^<;"[:space:]]'
          if git grep -nE "$pattern"; then
            echo "::error::Possible secret found (see matches above)"; exit 1
          fi

  backend:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Ecommerce.slnx
      - run: dotnet build Ecommerce.slnx --no-restore -c Release
      - name: Test (unit + Testcontainers integration, coverage)
        run: dotnet test Ecommerce.slnx --no-build -c Release --collect "Code Coverage;Format=cobertura" --logger trx --results-directory artifacts/test-results
      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: artifacts/test-results
      - run: dotnet tool restore
      - name: Migration drift check
        run: dotnet tool run dotnet-ef migrations has-pending-model-changes --project backend/src/Ecommerce.Persistence --startup-project backend/src/Ecommerce.Api --configuration Release --no-build
      - name: Idempotent migration script
        run: dotnet tool run dotnet-ef migrations script --idempotent --project backend/src/Ecommerce.Persistence --startup-project backend/src/Ecommerce.Api --configuration Release --no-build --output artifacts/migrations/migrate.sql
      - name: Docker image builds (not pushed)
        run: docker build -t ecommerce-api:ci .

  frontend:
    needs: secret-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/apps/store
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/apps/store/package-lock.json
      - run: npm ci
      - run: npx expo install --check
      - run: npx tsc --noEmit
      - name: Test hygiene (no tests under app/, no focused tests)
        run: |
          if git ls-files -- app | grep -E '\.test\.(ts|tsx)$'; then
            echo "::error::Test files under app/ become routes (architecture §5.4)"; exit 1
          fi
          if git grep -nE '(^|[^[:alnum:]_.])((it|test|describe)\.only|fit|fdescribe)[(.]' -- '*.test.ts' '*.test.tsx'; then
            echo "::error::Focused test found — it silently skips every other test"; exit 1
          fi
      - name: Unit + component tests
        run: npm test -- --ci --coverage
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/apps/store/coverage
      - run: npx expo export --platform web
