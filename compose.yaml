name: ecommerce
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_DB: ecommerce
      POSTGRES_HOST_AUTH_METHOD: trust      # local dev only, loopback-bound (D12)
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ecommerce-pg17-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=ecommerce;Username=ecommerce
      Cors__AllowedOrigins__0: http://localhost:8082
      Cors__AllowedOrigins__1: http://127.0.0.1:8082
      Identity__Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
      Identity__Bootstrap__AdminEmail: ${ADMIN_BOOTSTRAP_EMAIL:-}
      Identity__Bootstrap__AdminPassword: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      Identity__PasswordReset__LinkBaseUrl: http://localhost:8082/reset-password
      Notifications__DevPickupDirectory: /tmp/dev-mail
    ports:
      - "127.0.0.1:5081:8080"
  web:
    build:
      context: frontend/apps/store
      args:
        EXPO_PUBLIC_API_BASE_URL: http://localhost:5081
    ports:
      - "127.0.0.1:8082:80"
volumes:
  ecommerce-pg17-data:
